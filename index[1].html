<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible Campus Navigator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Accessible Campus Navigator</h1><p>Step-free routes and plain-language directions for three campus buildings.</p></header>
<main>
  <section aria-labelledby="plan">
    <h2 id="plan">Plan a route</h2>
    <label for="from">From</label><select id="from"></select>
    <label for="to">To</label><select id="to"></select>
    <fieldset><legend>Route type</legend>
      <label class="opt"><input type="radio" name="mode" value="stepfree" checked> Step-free (no stairs or steps)</label>
      <label class="opt"><input type="radio" name="mode" value="fastest"> Fastest (may use stairs)</label>
    </fieldset>
    <button id="go" class="primary">Find route</button>
  </section>
  <section aria-labelledby="res">
    <h2 id="res">Directions</h2>
    <p id="summary" tabindex="-1">Choose a start and destination, then select Find route.</p>
    <p id="compare"></p>
    <ol id="directions"></ol>
    <button id="speak">Read directions aloud</button>
  </section>
  <section aria-labelledby="lf">
    <h2 id="lf">Lift status</h2>
    <p>Report a lift that is not working. Routes update straight away.</p>
    <ul id="lifts"></ul>
  </section>
  <p id="status" role="status" aria-live="polite" class="live"></p>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
